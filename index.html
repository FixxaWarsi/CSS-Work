<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="container-fluid calculator-container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-xl-6 card glass-card p-3 shadow-lg">
                <div class="d-flex justify-content-between align-items-center mb-3 px-2">
                    <div class="d-flex gap-2">
                        <button id="theme-toggle" class="btn btn-ctrl" title="Toggle Theme">
                            <i class="bi bi-sun-fill text-warning d-none" id="theme-sun"></i>
                            <i class="bi bi-moon-stars-fill text-info" id="theme-moon"></i>
                        </button>
                        <button id="sound-toggle" class="btn btn-ctrl text-success" title="Toggle Sound">
                            <i class="bi bi-volume-up-fill" id="sound-icon"></i>
                        </button>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span id="mem-indicator" class="badge bg-secondary opacity-0 transition-300">M</span>
                        <span id="mode-indicator" class="badge bg-primary cursor-pointer" id="toggle-deg-rad">DEG</span>
                        <button id="toggle-history" class="btn btn-ctrl text-light" title="View History">
                            <i class="bi bi-clock-history"></i>
                        </button>
                    </div>
                </div>

                <div class="screen-wrapper p-3 mb-4 text-end position-relative">
                    <div id="history-line" class="text-muted text-truncate mb-1"></div>
                    <div id="main-display" class="fs-1 fw-semibold text-wrap text-break">0</div>
                    <div id="live-preview" class="text-info fs-6 opacity-75 mt-1">&nbsp;</div>
                    <button id="copy-btn" class="btn btn-sm btn-copy position-absolute bottom-0 start-0 m-2"
                        title="Copy Result">
                        <i class="bi bi-clipboard"></i>
                    </button>
                </div>

                <div class="calculator-pad">
                    <div class="row g-2 mb-2">
                        <div class="col"><button class="btn btn-mem w-100 py-3" data-action="mc">MC</button></div>
                        <div class="col"><button class="btn btn-mem w-100 py-3" data-action="mr">MR</button></div>
                        <div class="col"><button class="btn btn-mem w-100 py-3" data-action="m+">M+</button></div>
                        <div class="col"><button class="btn btn-mem w-100 py-3" data-action="m-">M-</button></div>
                        <div class="col"><button class="btn btn-mem w-100 py-3" data-action="ms">MS</button></div>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-func="sin">sin</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-func="cos">cos</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-func="tan">tan</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-func="log">log</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-func="ln">ln</button></div>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-func="asin">asin</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-func="acos">acos</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-func="atan">atan</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-char="π">π</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-char="e">e</button></div>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-func="sqr">x²</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-func="cube">x³</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-char="^">xʸ</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-func="sqrt">√</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-func="cbrt">³√</button></div>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-char="^root">ʸ√x</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-func="exp">eˣ</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-func="tenX">10ˣ</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-func="fact">!</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-func="abs">|x|</button></div>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col"><button class="btn btn-clear w-100 py-3" data-action="ce">CE</button></div>
                        <div class="col"><button class="btn btn-clear w-100 py-3" data-action="ac">AC</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-action="neg">±</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-action="rand">rand</button></div>
                        <div class="col"><button class="btn btn-op w-100 py-3" data-char="÷">÷</button></div>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col"><button class="btn btn-num w-100 py-3" data-char="7">7</button></div>
                        <div class="col"><button class="btn btn-num w-100 py-3" data-char="8">8</button></div>
                        <div class="col"><button class="btn btn-num w-100 py-3" data-char="9">9</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-char="(">(</button></div>
                        <div class="col"><button class="btn btn-op w-100 py-3" data-char="×">×</button></div>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col"><button class="btn btn-num w-100 py-3" data-char="4">4</button></div>
                        <div class="col"><button class="btn btn-num w-100 py-3" data-char="5">5</button></div>
                        <div class="col"><button class="btn btn-num w-100 py-3" data-char="6">6</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-char=")">)</button></div>
                        <div class="col"><button class="btn btn-op w-100 py-3" data-char="-">-</button></div>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col"><button class="btn btn-num w-100 py-3" data-char="1">1</button></div>
                        <div class="col"><button class="btn btn-num w-100 py-3" data-char="2">2</button></div>
                        <div class="col"><button class="btn btn-num w-100 py-3" data-char="3">3</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-char="%">%</button></div>
                        <div class="col"><button class="btn btn-op w-100 py-3" data-char="+">+</button></div>
                    </div>

                    <div class="row g-2">
                        <div class="col-6"><button class="btn btn-num w-100 py-3" data-char="0">0</button></div>
                        <div class="col"><button class="btn btn-num w-100 py-3" data-char=".">.</button></div>
                        <div class="col"><button class="btn btn-sci w-100 py-3" data-action="backspace"><i
                                    class="bi bi-backspace"></i></button></div>
                        <div class="col"><button class="btn btn-eq w-100 py-3" data-action="equals">=</button></div>
                    </div>
                </div>
            </div>

            <div id="history-panel"
                class="col-12 col-md-4 col-xl-3 card glass-card p-3 shadow-lg mt-3 mt-md-0 ms-md-3 d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="m-0 text-light"><i class="bi bi-clock-history me-2"></i>History</h5>
                    <div class="d-flex gap-2">
                        <button id="export-history-btn" class="btn btn-sm btn-outline-info" title="Export History"><i
                                class="bi bi-download"></i></button>
                        <button id="clear-history-btn" class="btn btn-sm btn-outline-danger" title="Clear History"><i
                                class="bi bi-trash"></i></button>
                    </div>
                </div>
                <div id="history-list" class="history-list-container pe-1 overflow-y-auto flex-grow-1">
                    <div class="text-muted text-center py-4 empty-msg">No history records yet</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
