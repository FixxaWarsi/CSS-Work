<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Kanban Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app-spinner"
        class="position-fixed top-0 start-0 w-100 h-100 bg-dark d-flex justify-content-center align-items-center"
        style="z-index: 9999; transition: opacity 0.5s ease;">
        <div class="spinner-border text-light" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg border-bottom sticky-top glass-card m-2">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center fw-bold fs-4 text-primary" href="#">
                <i class="bi bi-kanban me-2"></i>
                <span>TaskFlow</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <div class="mx-auto my-2 my-lg-0 w-50" style="min-width: 280px;">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0"><i
                                class="bi bi-search text-muted"></i></span>
                        <input type="text" id="global-search" class="form-control border-start-0"
                            placeholder="Search tasks by title or description..." aria-label="Search tasks">
                    </div>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-outline-primary d-flex align-items-center" data-bs-toggle="modal"
                        data-bs-target="#boardModal">
                        <i class="bi bi-folder-plus me-1"></i> Board
                    </button>
                    <button class="btn btn-primary d-flex align-items-center" data-bs-toggle="modal"
                        data-bs-target="#taskModal" id="btn-create-task">
                        <i class="bi bi-plus-circle me-1"></i> Task
                    </button>
                    <button class="btn btn-outline-secondary" id="theme-toggle" aria-label="Toggle theme">
                        <i class="bi bi-moon-stars" id="theme-icon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4 px-4">

        <div class="row g-3 align-items-center mb-4">
            <div class="col-12 col-xl-6">
                <div class="d-flex align-items-center gap-2 overflow-x-auto pb-2" id="boards-tabs-container">
                </div>
            </div>
            <div class="col-12 col-xl-6">
                <div class="d-flex flex-wrap justify-content-xl-end gap-2">
                    <select id="filter-priority" class="form-select form-select-sm w-auto">
                        <option value="All">All Priorities</option>
                        <option value="Low">Low Priority</option>
                        <option value="Medium">Medium Priority</option>
                        <option value="High">High Priority</option>
                    </select>

                    <select id="filter-deadline" class="form-select form-select-sm w-auto">
                        <option value="All">All Timelines</option>
                        <option value="Upcoming">Upcoming Tasks</option>
                        <option value="Overdue">Overdue Tasks</option>
                    </select>

                    <button class="btn btn-sm btn-outline-warning" id="btn-rename-board"><i class="bi bi-pencil"></i>
                        Rename Board</button>
                    <button class="btn btn-sm btn-outline-danger" id="btn-delete-board"><i class="bi bi-trash"></i>
                        Delete Board</button>
                </div>
            </div>
        </div>

        <div class="row g-3 mb-4" id="statistics-panel">
            <div class="col-6 col-md-3">
                <div class="card glass-card p-3 border-start border-4 border-primary">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted text-uppercase small mb-1">Total Tasks</h6>
                            <h3 class="fw-bold mb-0" id="stat-total">0</h3>
                        </div>
                        <div class="fs-2 text-primary opacity-75"><i class="bi bi-card-checklist"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card glass-card p-3 border-start border-4 border-success">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted text-uppercase small mb-1">Completed</h6>
                            <h3 class="fw-bold mb-0" id="stat-completed">0</h3>
                        </div>
                        <div class="fs-2 text-success opacity-75"><i class="bi bi-check2-circle"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card glass-card p-3 border-start border-4 border-warning">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted text-uppercase small mb-1">Pending</h6>
                            <h3 class="fw-bold mb-0" id="stat-pending">0</h3>
                        </div>
                        <div class="fs-2 text-warning opacity-75"><i class="bi bi-clock-history"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card glass-card p-3 border-start border-4 border-danger">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted text-uppercase small mb-1">High Priority</h6>
                            <h3 class="fw-bold mb-0" id="stat-high">0</h3>
                        </div>
                        <div class="fs-2 text-danger opacity-75"><i class="bi bi-exclamation-triangle"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4" id="kanban-board-grid">

            <div class="col-12 col-md-6 col-xl-4">
                <div class="card border-0 h-100 shadow-sm bg-body-tertiary">
                    <div
                        class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center pt-3 pb-2">
                        <div class="d-flex align-items-center gap-2">
                            <span
                                class="p-2 bg-primary-subtle text-primary rounded-circle d-flex align-items-center justify-content-center"
                                style="width:32px; height:32px;">
                                <i class="bi bi-list-task"></i>
                            </span>
                            <h5 class="fw-bold mb-0">To Do</h5>
                        </div>
                        <span class="badge bg-secondary rounded-pill" id="count-todo">0</span>
                    </div>
                    <div class="card-body kanban-column p-2 d-flex flex-column gap-3" id="col-todo" data-status="To Do">
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-xl-4">
                <div class="card border-0 h-100 shadow-sm bg-body-tertiary">
                    <div
                        class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center pt-3 pb-2">
                        <div class="d-flex align-items-center gap-2">
                            <span
                                class="p-2 bg-warning-subtle text-warning rounded-circle d-flex align-items-center justify-content-center"
                                style="width:32px; height:32px;">
                                <i class="bi bi-arrow-repeat"></i>
                            </span>
                            <h5 class="fw-bold mb-0">In Progress</h5>
                        </div>
                        <span class="badge bg-secondary rounded-pill" id="count-progress">0</span>
                    </div>
                    <div class="card-body kanban-column p-2 d-flex flex-column gap-3" id="col-progress"
                        data-status="In Progress">
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-12 col-xl-4">
                <div class="card border-0 h-100 shadow-sm bg-body-tertiary">
                    <div
                        class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center pt-3 pb-2">
                        <div class="d-flex align-items-center gap-2">
                            <span
                                class="p-2 bg-success-subtle text-success rounded-circle d-flex align-items-center justify-content-center"
                                style="width:32px; height:32px;">
                                <i class="bi bi-check-circle"></i>
                            </span>
                            <h5 class="fw-bold mb-0">Done</h5>
                        </div>
                        <span class="badge bg-secondary rounded-pill" id="count-done">0</span>
                    </div>
                    <div class="card-body kanban-column p-2 d-flex flex-column gap-3" id="col-done" data-status="Done">
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="modal fade" id="boardModal" tabindex="-1" aria-labelledby="boardModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="boardModalLabel"><i
                            class="bi bi-folder-plus text-primary me-2"></i>Create New Board</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="board-form">
                    <div class="modal-body py-3">
                        <div class="mb-3">
                            <label for="board-title" class="form-label fw-semibold">Board Name</label>
                            <input type="text" class="form-control" id="board-title"
                                placeholder="e.g., Work Projects, Personal Goals" required max="30">
                            <div class="invalid-feedback">Please name your workspace board context.</div>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Board</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content glass-card">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="taskModalLabel"><i
                            class="bi bi-card-checklist text-primary me-2"></i>Create Structural Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="task-form" class="needs-validation" novalidate>
                    <input type="hidden" id="task-edit-id" value="">
                    <div class="modal-body py-3 row g-3">
                        <div class="col-12">
                            <label for="task-title" class="form-label fw-semibold">Task Title *</label>
                            <input type="text" class="form-control" id="task-title"
                                placeholder="Enter clean descriptive summary name..." required>
                            <div class="invalid-feedback">Task summary heading mapping is tracking required.</div>
                        </div>
                        <div class="col-12">
                            <label for="task-desc" class="form-label fw-semibold">Detailed Description</label>
                            <textarea class="form-control" id="task-desc" rows="4"
                                placeholder="Flesh out criteria definitions, functional paths, and metrics specs here..."></textarea>
                        </div>
                        <div class="col-md-4">
                            <label for="task-priority" class="form-label fw-semibold">Priority Alignment</label>
                            <select id="task-priority" class="form-select">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="task-deadline" class="form-label fw-semibold">Target Deadline Date</label>
                            <input type="date" id="task-deadline" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label for="task-status" class="form-label fw-semibold">Pipeline State Workflow</label>
                            <select id="task-status" class="form-select">
                                <option value="To Do" selected>To Do</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Done">Done</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="btn-task-form-submit">Save Component
                            State</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-rendering-wrapper"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>
</body>

</html>
